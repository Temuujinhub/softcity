<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1200" height="760" fill="#faf9f6"/>

  <!-- Title -->
  <text x="60" y="52" font-size="26" font-weight="700" fill="#141414">Зөөлөн хот фестиваль — Үзэсгэлэнгийн талбайн зураглал</text>
  <text x="60" y="78" font-size="14" fill="#8a8479">Түр зохиомол зураглал — админы «Контент» хэсгээс жинхэнэ зургаар солино</text>

  <!-- Hall outline -->
  <rect x="60" y="100" width="1080" height="580" fill="#ffffff" stroke="#141414" stroke-width="3"/>

  <!-- Stage -->
  <rect x="440" y="100" width="320" height="70" fill="#141414"/>
  <text x="600" y="143" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">ТАЙЗ</text>

  <!-- Entrance -->
  <rect x="520" y="676" width="160" height="8" fill="#faf9f6"/>
  <path d="M560 700 L600 664 L640 700" fill="none" stroke="#c4734a" stroke-width="3"/>
  <text x="600" y="726" font-size="16" font-weight="700" fill="#c4734a" text-anchor="middle">ОРЦ / ГАРЦ</text>

  <!-- Top row booths: A1-A4 left of stage, A5-A8 right of stage -->
  <g stroke="#141414" stroke-width="2" fill="#efe9de">
    <rect x="100" y="120" width="75" height="75"/>
    <rect x="185" y="120" width="75" height="75"/>
    <rect x="270" y="120" width="75" height="75"/>
    <rect x="355" y="120" width="75" height="75"/>
    <rect x="770" y="120" width="75" height="75"/>
    <rect x="855" y="120" width="75" height="75"/>
    <rect x="940" y="120" width="75" height="75"/>
    <rect x="1025" y="120" width="75" height="75"/>
  </g>
  <g font-size="18" font-weight="700" fill="#141414" text-anchor="middle">
    <text x="137" y="164">A1</text><text x="222" y="164">A2</text><text x="307" y="164">A3</text><text x="392" y="164">A4</text>
    <text x="807" y="164">A5</text><text x="892" y="164">A6</text><text x="977" y="164">A7</text><text x="1062" y="164">A8</text>
  </g>

  <!-- Left column booths B1-B4 -->
  <g stroke="#141414" stroke-width="2" fill="#efe9de">
    <rect x="100" y="240" width="75" height="90"/>
    <rect x="100" y="340" width="75" height="90"/>
    <rect x="100" y="440" width="75" height="90"/>
    <rect x="100" y="540" width="75" height="90"/>
  </g>
  <g font-size="18" font-weight="700" fill="#141414" text-anchor="middle">
    <text x="137" y="292">B1</text><text x="137" y="392">B2</text><text x="137" y="492">B3</text><text x="137" y="592">B4</text>
  </g>

  <!-- Right column booths B5-B8 -->
  <g stroke="#141414" stroke-width="2" fill="#efe9de">
    <rect x="1025" y="240" width="75" height="90"/>
    <rect x="1025" y="340" width="75" height="90"/>
    <rect x="1025" y="440" width="75" height="90"/>
    <rect x="1025" y="540" width="75" height="90"/>
  </g>
  <g font-size="18" font-weight="700" fill="#141414" text-anchor="middle">
    <text x="1062" y="292">B5</text><text x="1062" y="392">B6</text><text x="1062" y="492">B7</text><text x="1062" y="592">B8</text>
  </g>

  <!-- Center island booths C1-C6 -->
  <g stroke="#141414" stroke-width="2" fill="#e8d5c4">
    <rect x="330" y="300" width="110" height="110"/>
    <rect x="470" y="300" width="110" height="110"/>
    <rect x="610" y="300" width="110" height="110"/>
    <rect x="330" y="460" width="110" height="110"/>
    <rect x="470" y="460" width="110" height="110"/>
    <rect x="610" y="460" width="110" height="110"/>
  </g>
  <g font-size="20" font-weight="700" fill="#141414" text-anchor="middle">
    <text x="385" y="362">C1</text><text x="525" y="362">C2</text><text x="665" y="362">C3</text>
    <text x="385" y="522">C4</text><text x="525" y="522">C5</text><text x="665" y="522">C6</text>
  </g>

  <!-- Cafe corner -->
  <rect x="790" y="460" width="180" height="110" fill="#c4734a" stroke="#141414" stroke-width="2"/>
  <text x="880" y="522" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">КАФЕ</text>

  <!-- Info desk -->
  <rect x="790" y="300" width="180" height="70" fill="#141414"/>
  <text x="880" y="342" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">МЭДЭЭЛЛИЙН ЦЭГ</text>

  <!-- Legend -->
  <g font-size="14" fill="#55504a">
    <rect x="60" y="700" width="18" height="18" fill="#efe9de" stroke="#141414" stroke-width="1.5"/>
    <text x="86" y="714">Захын талбай (A, B) — 3×3 м</text>
    <rect x="310" y="700" width="18" height="18" fill="#e8d5c4" stroke="#141414" stroke-width="1.5"/>
    <text x="336" y="714">Төвийн талбай (C) — 4×4 м</text>
  </g>
</svg>
